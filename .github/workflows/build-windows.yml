name: Build Windows bundle

# Triggers:
# * Manual ("Run workflow" in the Actions tab) — produces a workflow
#   artifact only. Useful for testing.
# * Tag push (``git tag v0.1.0 && git push --tags``) — produces a
#   Release with the .zip attached and a public download URL.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # required so the action can create a Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -e ".[gui]" pyinstaller

      - name: Download spaCy models
        shell: pwsh
        run: |
          .venv\Scripts\python -m spacy download en_core_web_lg
          .venv\Scripts\python -m spacy download it_core_news_lg

      - name: Build bundle
        shell: pwsh
        run: |
          .\packaging\build_windows.ps1

      - name: Zip the bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dist\DocShield -DestinationPath dist\DocShield-windows.zip

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\DocShield-windows.zip -Algorithm SHA256).Hash
          "DocShield-windows.zip  $hash" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: DocShield-windows
          path: |
            dist/DocShield-windows.zip
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Auto-generated release notes from PRs/commits since the last tag.
          generate_release_notes: true
          files: |
            dist/DocShield-windows.zip
            dist/SHA256SUMS.txt
