[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docshield"
version = "0.1.0"
description = "Offline DOCX PII anonymiser with reversible mapping"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jose" }]
dependencies = [
    "python-docx>=1.1",
    "lxml>=5.1",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "cryptography>=42",
    "argon2-cffi>=23",
    "langdetect>=1.0.9",
    "platformdirs>=4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "black>=24",
    "mypy>=1.10",
]

[project.scripts]
docshield = "docshield.cli:main"
docshield-gui = "docshield.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/docshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
